name: Build EIF Image (Arb)

on:
  workflow_dispatch:
    inputs:
      config_hash:
        type: string
        description: 'SHA256 hash for the config (without DA fields)'
        required: true
      config_hash_da:
        type: string
        description: 'SHA256 hash for the config with DA (only needed if DA enabled)'
        required: false
      aws_region:
        type: string
        description: 'AWS region for Secrets Manager'
        required: true
      aws_secret_id:
        type: string
        description: 'AWS Secrets Manager secret ARN or name'
        required: true
      nitro_node_image_path:
        type: string
        description: 'Full nitro node image path'
        required: true
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

run-name: Build EIF (Nix) - ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.config_hash || github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af

      - name: Checkout aws-nitro
        uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Docker image to digest
        working-directory: nitro
        run: |
          IMAGE_PATH="${{ github.event.inputs.nitro_node_image_path }}"
          IMAGE_NAME="${IMAGE_PATH%:*}"
          IMAGE_TAG="${IMAGE_PATH##*:}"

          echo "Resolving ${IMAGE_NAME}:${IMAGE_TAG} via nix-prefetch-docker..."
          nix run nixpkgs#nix-prefetch-docker -- \
            --image-name "$IMAGE_NAME" \
            --image-tag "$IMAGE_TAG" \
            --json > nitro-image.json

          echo "nix-prefetch-docker raw output:"
          cat nitro-image.json

      - name: Write build params
        run: |
          cat > nitro/build-params.sh << 'PARAMS_EOF'
          export EXPECTED_CONFIG_SHA256="${{ github.event.inputs.config_hash }}"
          export EXPECTED_CONFIG_SHA256_DA="${{ github.event.inputs.config_hash_da }}"
          export AWS_REGION="${{ github.event.inputs.aws_region }}"
          export AWS_SECRET_ID="${{ github.event.inputs.aws_secret_id }}"
          PARAMS_EOF

      - name: Build EIF
        working-directory: nitro
        run: |
          nix build .#x86_64-eif -L --out-link ./eif-result

          cp ./eif-result/batcher.eif ./enclave.eif
          cp ./eif-result/pcr.json ./pcr.json

          echo "Built files:"
          ls -lh ./enclave.eif ./pcr.json

          echo "PCR Measurements:"
          jq . ./pcr.json

      - name: Build enclaver binary
        working-directory: nitro
        run: |
          nix build .#enclaver -L --out-link ./enclaver-result
          cp ./enclaver-result/bin/enclaver ./enclaver
          chmod +x ./enclaver

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Compute enclave hash
        working-directory: nitro
        run: |
          PCR0=$(jq -r '.PCR0' ./pcr.json)
          PCR0_KECCAK=$(cast keccak "0x${PCR0}")

          echo "PCR0_RAW=0x${PCR0}" >> $GITHUB_ENV
          echo "ENCLAVE_HASH=${PCR0_KECCAK}" >> $GITHUB_ENV

          echo "PCR0:         0x${PCR0}"
          echo "Enclave Hash: ${PCR0_KECCAK}"

      - name: Build summary
        run: |
          echo "## EIF Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **PCR0** | \`${{ env.PCR0_RAW }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Enclave Hash (keccak)** | \`${{ env.ENCLAVE_HASH }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Config Hash** | \`${{ github.event.inputs.config_hash }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Config Hash (DA)** | \`${{ github.event.inputs.config_hash_da }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Nitro Node Image** | \`${{ github.event.inputs.nitro_node_image_path }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Git SHA** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY

          mkdir -p artifacts
          jq -n \
            --arg config_hash "${{ github.event.inputs.config_hash }}" \
            --arg config_hash_da "${{ github.event.inputs.config_hash_da }}" \
            --arg aws_region "${{ github.event.inputs.aws_region }}" \
            --arg nitro_node_image_path "${{ github.event.inputs.nitro_node_image_path }}" \
            --arg pcr0 "${{ env.PCR0_RAW }}" \
            --arg enclave_hash "${{ env.ENCLAVE_HASH }}" \
            --arg git_sha "${{ github.sha }}" \
            '{config_hash: $config_hash, config_hash_da: $config_hash_da, aws_region: $aws_region, nitro_node_image_path: $nitro_node_image_path, pcr0: $pcr0, enclave_hash: $enclave_hash, git_sha: $git_sha}' \
            > artifacts/build-info.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eif-${{ github.run_id }}
          path: |
            nitro/enclave.eif
            nitro/pcr.json
            nitro/enclaver
            artifacts/
